<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head><body class="auth-page"><div class="auth-card"><h1>IOTSTAR SHOP</h1><h2>Quên mật khẩu</h2><div class="error" th:if="${error}" th:text="${error}"></div><form th:action="@{/forgot-password}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email tài khoản</label><input type="email" name="email" required autofocus><label>Mật khẩu mới</label><input type="password" name="password" minlength="6" required><label>Nhập lại mật khẩu mới</label><input type="password" name="confirmPassword" minlength="6" required><button type="submit">Đổi mật khẩu</button></form><div class="auth-links single"><a th:href="@{/login}">Quay lại đăng nhập</a></div></div></body></html>
