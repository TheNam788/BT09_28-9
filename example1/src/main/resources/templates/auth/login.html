<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head><body class="auth-page"><div class="auth-card"><h1>IOTSTAR SHOP</h1><h2>Đăng nhập</h2><div class="error" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div><div class="success" th:if="${param.logout}">Bạn đã đăng xuất.</div><div class="success" th:if="${param.registered}">Tạo tài khoản thành công. Bạn có thể đăng nhập.</div><div class="success" th:if="${param.reset}">Đổi mật khẩu thành công. Bạn có thể đăng nhập.</div><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email</label><input type="email" name="email" required autofocus><label>Mật khẩu</label><input type="password" name="password" required><button type="submit">Đăng nhập</button></form><div class="auth-links"><a th:href="@{/register}">Tạo tài khoản</a><a th:href="@{/forgot-password}">Quên mật khẩu?</a></div></div></body></html>
