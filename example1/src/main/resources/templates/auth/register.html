<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Tạo tài khoản')}"></head><body class="auth-page"><div class="auth-card"><h1>IOTSTAR SHOP</h1><h2>Tạo tài khoản</h2><div class="error" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Họ tên</label><input type="text" name="fullName" required autofocus><label>Email</label><input type="email" name="email" required><label>Mật khẩu</label><input type="password" name="password" minlength="6" required><label>Nhập lại mật khẩu</label><input type="password" name="confirmPassword" minlength="6" required><button type="submit">Tạo tài khoản</button></form><div class="auth-links single"><a th:href="@{/login}">Đã có tài khoản? Đăng nhập</a></div></div></body></html>
