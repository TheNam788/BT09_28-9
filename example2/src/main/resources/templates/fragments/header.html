<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="topbar">
        <a class="brand" th:href="@{/}">UTEShop</a>

        <div class="profile" th:if="${#authorization.expression('isAuthenticated()')}">
            <img
                th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/user.svg'}"
                alt="Avatar">

            <div>
                <b th:text="${#authentication.principal.fullName}">Full name</b>
                <small>
                    <span th:text="${#authentication.principal.username}">username</span>
                    ·
                    <span th:text="${#authentication.principal.email}">email</span>
                </small>
            </div>

            <form th:action="@{/logout}" method="post">
                <button type="submit">Đăng xuất</button>
            </form>
        </div>
    </header>
</body>
</html>
